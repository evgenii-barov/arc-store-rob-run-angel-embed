<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Angel × ARC Store — ROB RUN OBS banner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="banner" aria-label="ARC Store — партнёрский баннер ROB RUN">
    <div class="banner__scene" aria-hidden="true"></div>
    <div class="banner__pattern" aria-hidden="true"></div>
    <div class="banner__vignette" aria-hidden="true"></div>
    <div class="banner__sweep" aria-hidden="true"></div>

    <section class="brand" aria-label="ARC Store и ROB RUN">
      <span class="arc-lockup">
        <img class="arc-cart" src="assets/arc-store-cart.webp" alt="ARC Store">
        <img class="arc-wordmark" src="assets/arc-store-wordmark.png" alt="">
      </span>
      <span class="cross" aria-hidden="true">×</span>
      <img class="rob-run" src="assets/rob-run-logo.png" alt="ROB RUN">
    </section>

    <section class="offer" aria-label="Скидка десять процентов, промокод ANGEL">
      <strong>Скидка 10%</strong>
      <span class="code"><span class="code__glow" aria-hidden="true"></span>ПРОМОКОД ANGEL</span>
    </section>

    <section class="destination">
      <strong>ARC-STORE.RU/ROB-RUN</strong>
      <span>ссылка под стримом</span>
    </section>
  </main>
</body>
</html>
