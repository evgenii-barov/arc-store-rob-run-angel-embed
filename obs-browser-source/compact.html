<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Angel × ARC Store — compact ROB RUN OBS banner</title>
  <link rel="stylesheet" href="compact.css">
</head>
<body>
  <main class="compact" aria-label="Компактный партнёрский баннер ARC Store и ROB RUN">
    <div class="compact__scene" aria-hidden="true"></div>
    <div class="compact__shade" aria-hidden="true"></div>
    <div class="compact__sweep" aria-hidden="true"></div>

    <section class="brand" aria-label="ARC Store и ROB RUN">
      <img class="arc-cart" src="assets/arc-store-cart.webp" alt="ARC Store">
      <img class="arc-wordmark" src="assets/arc-store-wordmark.png" alt="">
      <span class="cross" aria-hidden="true">×</span>
      <img class="rob-run" src="assets/rob-run-logo.png" alt="ROB RUN">
    </section>

    <span class="divider" aria-hidden="true"></span>

    <section class="messages" aria-label="Партнёр ARC Store, скидка 10 процентов, промокод ANGEL">
      <strong class="message message--partner">Официальный партнёр ARC Store</strong>
      <strong class="message message--offer">Скидка 10% · промокод ANGEL</strong>
      <strong class="message message--url">ARC-STORE.RU/ROB-RUN</strong>
    </section>
  </main>
</body>
</html>
